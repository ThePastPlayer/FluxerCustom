http:
  routers:
    fluxer-custom-downloads:
      rule: "Host(`chat.lepast.fr`) && (Path(`/fluxer-custom`) || PathPrefix(`/fluxer-custom/`))"
      entryPoints: [websecure]
      priority: 20000
      service: fluxer-custom-downloads
      middlewares: [fluxer-custom-download-policy]
      tls: {}
  middlewares:
    fluxer-custom-download-policy:
      headers:
        customResponseHeaders:
          # Hash of the single inline platform selector in index.html (LF).
          Content-Security-Policy: "default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-XS3sGvSWPvzzQBkreeCcs5SXLvep2fozTs+zlElkZHE='; base-uri 'none'; frame-ancestors 'none'"
  services:
    fluxer-custom-downloads:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8179"
